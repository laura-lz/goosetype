<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GooseType</title>
    <link rel="stylesheet" href="src/styles.css?v=6" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>GooseType</h1>
          <p>Generate a goose-built font family from an image library.</p>
        </div>
        <button id="downloadButton" class="downloadButton" type="button" aria-describedby="exportStatus" disabled>
          Download TTF
        </button>
      </header>

      <section class="workspace">
        <aside class="controls" aria-label="Font generation controls">
          <label class="field">
            <span>Text Input</span>
            <textarea id="textInput" rows="4" maxlength="120">goosetype</textarea>
          </label>

          <div class="field">
            <span>Preset</span>
            <div class="segmented" id="styleGroup" aria-label="Style toggles">
              <button type="button" data-style="italic" aria-pressed="false">Italic</button>
              <button type="button" data-style="bold" aria-pressed="false">Bold</button>
            </div>
          </div>

          <label class="slider">
            <span>
              <b>Readability</b>
            </span>
            <input id="readabilitySlider" type="range" min="0" max="100" value="68" />
          </label>

          <label class="slider">
            <span>
              <b>Smoothing</b>
            </span>
            <input id="blurSlider" type="range" min="0" max="10" step="0.5" value="0" />
          </label>

          <div class="field">
            <span>Mode</span>
            <div class="segmented modeSegmented" id="modeGroup">
              <button class="active" type="button" data-mode="photo">Photo</button>
              <button type="button" data-mode="silhouette">Silhouette</button>
            </div>
          </div>
        </aside>

        <section class="displayPanel" aria-label="Generated font display">
          <div class="displayHeader">
            <div>
              <span class="eyebrow">Font Display</span>
              <h2 id="previewTitle">GooseType Standard</h2>
            </div>
            <div class="scoreBadge">
              <span id="readabilityLabel">68%</span>
              <small id="readabilityModeLabel">readable</small>
            </div>
          </div>

          <div class="fontDisplayBox">
            <div id="fontPreview" class="fontPreview" aria-live="polite"></div>
          </div>

          <section class="candidatePanel" aria-label="Letter candidate details">
            <div>
              <strong>Candidate Library</strong>
              <p id="candidateStatus">Loading processed goose candidates...</p>
            </div>
            <div id="candidateStrip" class="candidateStrip"></div>
          </section>

          <div class="exportPanel">
            <div>
              <strong>TTF Export</strong>
              <p id="exportStatus">Frontend request builder ready. Backend font generation endpoint pending.</p>
            </div>
            <button id="requestButton" type="button">Download Request JSON</button>
          </div>
        </section>
      </section>
    </main>

    <script src="src/app.js?v=6"></script>
  </body>
</html>
